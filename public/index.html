</head>
<body>

<nav class="navbar">
  <a href="#" class="navbar-brand">TuPatente</a>
  <a href="login_colab.html" class="btn-colab">Login Colaboradores</a>
</nav>

<div class="container-main">
  <div class="auth-card">
    <div id="loginSection">
      <h2>Iniciar Sesión</h2>
      <form id="loginForm">
        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" id="loginEmail" placeholder="ejemplo@correo.com" required>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-submit">Ingresar</button>
      </form>

      <div class="separator">o ingresa con</div>

      <button class="btn-google" type="button" onclick="window.location.href='https://tupatente-backend.onrender.com/api/users/auth/google'">
        <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google Logo">
        Continuar con Google
      </button>

      <div class="auth-footer">
        ¿Aún no estás registrado? <span class="auth-link" onclick="alternarVista(true)">Crea una cuenta aquí</span>
      </div>
    </div>

    <div id="registerSection" class="hidden">
      <h2>Crear Cuenta</h2>
      <form id="registerForm">
        <div class="form-group">
          <label>Nombre Completo</label>
          <input type="text" id="registerName" placeholder="Juan Pérez" required>
        </div>
        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" id="registerEmail" placeholder="ejemplo@correo.com" required>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="registerPassword" placeholder="Crea tu contraseña" required>
        </div>
        <button type="submit" class="btn-submit">Registrarse</button>
      </form>

      <div class="auth-footer">
        ¿Ya tienes una cuenta? <span class="auth-link" onclick="alternarVista(false)">Inicia sesión</span>
      </div>
    </div>
  </div>
</div>

<script>
  function alternarVista(showRegister) {
    document.getElementById('loginSection').classList.toggle('hidden', showRegister);
    document.getElementById('registerSection').classList.toggle('hidden', !showRegister);
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const correo = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;

    try {
      const response = await fetch('https://tupatente-backend.onrender.com/api/users/login-usuario', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ correo, password })
      });
      const data = await response.json();
      
      if (data.success) {
        const user = data.usuario;
        if (user.rol === 'INVITADO') {
          const comuna = user.comuna_tramite;
          window.location.href = (!comuna || comuna === "No especificada") ? 'formulario.html' : 'dashboard.html';
        } else if (user.rol === 'CLIENTE') {
          window.location.href = 'panel_cliente.html';
        }
      } else { 
        alert(data.mensaje); 
      }
    } catch (err) { 
      alert('Error al intentar iniciar sesión.'); 
    }
  });

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const nombre = document.getElementById('registerName').value;
    const correo = document.getElementById('registerEmail').value;
    const password = document.getElementById('registerPassword').value;

    try {
      const response = await fetch('https://tupatente-backend.onrender.com/api/users/registrar_local', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ nombre, correo, password })
      });
      
      const data = await response.json();
      
      if (data.success) {
        alert("Cuenta creada exitosamente. Ahora puedes iniciar sesión.");
        alternarVista(false);
      } else { 
        alert(data.mensaje || "Error al registrar."); 
      }
    } catch (err) {
      console.error(err);
      alert('Error de conexión con el servidor.');
    }
  });
</script>
</body>
</html>
